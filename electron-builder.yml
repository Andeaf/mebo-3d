# Windows installer (NSIS, x64): `npm run dist` → release/Mebo-3D-Setup-<version>.exe
# The version comes from package.json. Unsigned (see README.md: SmartScreen).
appId: nl.mebokeukens.mebo3d
productName: Mebo 3D
directories:
  output: release
  buildResources: build
# Main and preload import only electron + node built-ins, and vite bundles every
# UI library into out/renderer, so the asar holds the build output alone.
files:
  - out/**/*
  - package.json
  - '!node_modules/**'
# The shipped price list goes beside the app, never inside the asar:
# <install dir>/resources/data/materials.json (process.resourcesPath). The app
# does not price with it: on first run it is copied to the user's data folder
# (%APPDATA%\mebo-3d\materials.json), which the firm edits and which a
# reinstall never overwrites; later versions only append new ids to it
# (src/main/priceList.ts).
extraResources:
  - from: data
    to: data
    filter:
      - '**/*'
asar: true
# No update feed: auto-updates are out of scope (this also stops app-update.yml / latest.yml).
publish: null
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Mebo-3D-Setup-${version}.exe
nsis:
  # Assisted (not one-click): the user sees where the app is installed.
  oneClick: false
  # Per-user, no admin: %LOCALAPPDATA%\Programs\Mebo 3D
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mebo 3D
  # The price list, recents and language (in %APPDATA%\mebo-3d — Electron names
  # userData after package.json `name`) survive a reinstall and an uninstall.
  deleteAppDataOnUninstall: false
fileAssociations:
  - ext: mebo
    name: Mebo3DProject
    description: Mebo 3D-project
    role: Editor
